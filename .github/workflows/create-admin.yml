
name: Create or update FUD admin

on:
  workflow_dispatch:

jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      
      - name: Create FUD Django superuser
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: fud-c0pq.onrender.com
          NEW_ADMIN_PASSWORD: ${{ secrets.NEW_ADMIN_PASSWORD }}
        run: |
          python manage.py shell -c "
          import os
          from django.contrib.auth import get_user_model

          User = get_user_model()
          field = User.USERNAME_FIELD
          user = User.objects.filter(**{field: 'toby'}).first()

          if user is None:
              user = User(**{field: 'toby'})

          user.set_password(os.environ['NEW_ADMIN_PASSWORD'])
          user.is_staff = True
          user.is_superuser = True
          user.save()

          if hasattr(user, 'role'):
              user.role = 'platform_admin'
              user.save()

          print('FUD Django superuser created or updated successfully.')
          "

          user.save()
          print('Password reset successfully for account toby.')
          "
